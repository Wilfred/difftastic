name: Deploy Manual

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: '0.5.2'

      - name: Build manual
        run: mdbook build
        working-directory: manual

      - name: Build translated manual
        run: mdbook build
        working-directory: translation/zh-CN/manual-zh-CN

      - name: Add rustdoc output
        run: cp -r target/doc manual/book/rustdoc

      - name: Add translated manual output
        run: cp -r translation/zh-CN/manual-zh-CN/book manual/book/zh-CN

      - name: Add homepage
        run: cp -r homepage/* manual/book/

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@920cbb300dcd3f0568dbc42700c61e2fd9e6139c # v4.6.4
        with:
          branch: gh-pages
          folder: manual/book
          single-commit: true
          force: true
